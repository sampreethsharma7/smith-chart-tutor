# Builds the ready-made downloads (Windows installer + portable, Mac dmg/zip, Linux AppImage/deb).
#
#   Pushing a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
#   (the tag must match "version" in package.json), puts them all in one DRAFT release:
#   check it on the Releases page, then press "Publish release" to make it public.
#
#   Running it by hand (Actions → Release → Run workflow) only builds, and keeps the files as
#   downloadable artifacts of that run: handy for trying a build before tagging.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm test

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version $v"; exit 1; }

      - run: npm run build

      # Files only: the release job below collects all three systems into one draft
      # (builds publishing on their own each make a separate draft).
      - name: Package
        run: npx --yes electron-builder@26.15.3 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: smith-chart-tutor-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One draft release with every download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" \
            --notes "Download the file for your computer: the [README](https://github.com/$GITHUB_REPOSITORY#getting-started) says which one, and what to click the first time."
